name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs (debug + release)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p apks/debug apks/release
          cp app/build/outputs/apk/debug/*.apk apks/debug/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apks/release/ 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMeter-APKs
          path: |
            apks/debug/*.apk
            apks/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apks/release/*.apk
          generate_release_notes: true
